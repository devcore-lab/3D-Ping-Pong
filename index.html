const $=id=>document.getElementById(id), screen=$('tourScreen'), body=$('tourBody'), notice=$('tourNotice');
const names=['London','Paris','Berlin','Tokyo','New York','Shanghai','Singapore','Sydney','Seoul','Stockholm','Rio','Warsaw','Manchester','Mumbai','Osaka','Toronto','Lyon','Miami','Prague','Vienna','Rome','Madrid','Lisbon','Helsinki','Copenhagen','Oslo','Zurich','Brussels','Amsterdam','Dublin','Istanbul','Dubai','Cairo','Cape Town','Lagos','Buenos Aires','Mexico City','São Paulo','Bangkok','Kuala Lumpur','Jakarta','Manila','Hanoi','Taipei','Hong Kong','Beijing','Chengdu','Busan','Melbourne','Auckland','Chicago','Los Angeles','San Francisco','Boston','Montreal','Vancouver','Edinburgh','Birmingham','Kraków','Budapest','Athens','Milan','Naples','Hamburg','Munich','Marseille','Nice','Bordeaux','Rotterdam','Antwerp','Geneva','Basel','Delhi','Chennai','Bengaluru','Pune','Nagoya','Kyoto','Sapporo','Fukuoka'];
const flags=['🇬🇧','🇫🇷','🇩🇪','🇯🇵','🇺🇸','🇨🇳','🇸🇬','🇦🇺','🇰🇷','🇸🇪','🇧🇷','🇵🇱','🇬🇧','🇮🇳','🇯🇵','🇨🇦','🇫🇷','🇺🇸','🇨🇿','🇦🇹','🇮🇹','🇪🇸','🇵🇹','🇫🇮','🇩🇰','🇳🇴','🇨🇭','🇧🇪','🇳🇱','🇮🇪','🇹🇷','🇦🇪','🇪🇬','🇿🇦','🇳🇬','🇦🇷','🇲🇽','🇧🇷','🇹🇭','🇲🇾','🇮🇩','🇵🇭','🇻🇳','🇹🇼','🇭🇰','🇨🇳','🇨🇳','🇰🇷','🇦🇺','🇳🇿','🇺🇸','🇺🇸','🇺🇸','🇺🇸','🇨🇦','🇨🇦','🇬🇧','🇬🇧','🇵🇱','🇭🇺','🇬🇷','🇮🇹','🇮🇹','🇩🇪','🇩🇪','🇫🇷','🇫🇷','🇫🇷','🇳🇱','🇧🇪','🇨🇭','🇨🇭','🇮🇳','🇮🇳','🇮🇳','🇮🇳','🇯🇵','🇯🇵','🇯🇵','🇯🇵'];
const first=['Chen','Haruto','Lukas','Oliver','Jan','Min','Sofia','Alex','Marco','Noah','Emilia','Leo','Hana','Sam','Kai','Yuki','Nina','Daniel','Amir','Tomas'];
const last=['Wei','Tanaka','Müller','Smith','Kowalski','Park','Rossi','Brown','Silva','Andersson','Novak','Kim','Wang','Wilson','Sato','Garcia','Chen','Lee','Khan','Dubois'];
const points=[100,250,500,1000], tiers=['International Open','World Challenger','World Series','Grand Masters'];
const events=[];for(let i=0;i<80;i++){let week=Math.floor(i*52/80)+1;let tier=i%11===0?3:i%5===0?2:i%3===0?1:0;events.push({id:i,week,city:names[i],flag:flags[i],tier,points:points[tier],name:names[i]+' '+(tier===3?'Grand Masters':tier===2?'World Series':tier===1?'Challenger':'Open')});}
// The season-ending finals and biennial championship are separate competitions.
events.push({id:80,week:50,city:'Singapore',flag:'🇸🇬',tier:4,points:1500,name:'World Tour Finals'});
events.push({id:81,week:52,city:'World Championship',flag:'🌍',tier:5,points:2000,name:'World Championship'});
function fresh(){return {year:2027,week:1,points:0,wins:0,losses:0,titles:[],history:[],active:null,country:'',rivals:Array.from({length:32},(_,i)=>({name:first[i%20]+' '+last[(i*7+3)%20],flag:flags[(i*3)%flags.length],points:Math.max(40,2700-i*74)}))};}
let career;try{career=JSON.parse(localStorage.getItem('pp3d_world_tour_v1')||'null')||fresh();if(!Array.isArray(career.history)||!Array.isArray(career.rivals))career=fresh();}catch{career=fresh();}
let tab='calendar',message='';const save=()=>{try{localStorage.setItem('pp3d_world_tour_v1',JSON.stringify(career));}catch{message='Storage unavailable: progress may not persist.';}};
const ranking=()=>1+career.rivals.filter(p=>p.points>career.points).length;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function available(e){return e.id!==81||career.year%2===0;}
function canEnter(e){return available(e)&&ranking()<=(e.tier>=5?16:e.tier===4?24:e.tier===3?24:999);}
function resultRecord(e,round){career.history.unshift({year:career.year,event:e.name,round,points:e.points,flag:e.flag});career.history=career.history.slice(0,400);}
function simulateWeek(){for(let i=0;i<career.rivals.length;i++){const r=career.rivals[i];r.points=Math.max(0,Math.round(r.points*.996+Math.random()*45-12));}}
function nextWeek(){if(career.active)return;simulateWeek();career.week++;if(career.week>52){career.week=1;career.year++;career.points=Math.round(career.points*.72);career.rivals.forEach(r=>r.points=Math.round(r.points*.72));}save();render();}
function enter(id){const e=events.find(e=>e.id===id);if(!e||e.week!==career.week||!canEnter(e)||career.active)return;const pool=career.rivals.slice().sort((a,b)=>b.points-a.points);const start=e.tier>=3?0:e.tier===2?4:e.tier===1?10:18;const opponents=[];for(let i=0;i<3;i++)opponents.push(pool[Math.min(pool.length-1,start+((id*3+i*5+career.year)%Math.max(1,pool.length-start)))]?.name||'Tour Challenger');career.active={id,round:0,opponents};message='Tournament entered. Win three matches to claim the title!';save();render();}
function play(){if(!career.active)return;screen.hidden=true;window.tourPlaying=true;const wc=$('welcomeCountry');if(career.country){wc.value=career.country;wc.dispatchEvent(new Event('change'));}if(!wc.value){wc.value='United Kingdom';wc.dispatchEvent(new Event('change'));} $('welcomePlay').click();}
window.tourMatchFinished=function(won){if(!window.tourPlaying||!career.active)return;window.tourPlaying=false;const a=career.active,e=events.find(ev=>ev.id===a.id);if(won){career.wins++;a.round++;if(a.round>=3){career.points+=e.points;career.titles.push({year:career.year,event:e.name,flag:e.flag});resultRecord(e,'Champion');career.active=null;message='🏆 CHAMPION! You won '+e.name+' and earned '+e.points+' ranking points.';}else{career.points+=Math.round(e.points*.08);message='✅ Victory! Next: '+['Semifinal','Final'][a.round-1]+'.';}}else{career.losses++;const round=['Quarterfinal','Semifinal','Final'][a.round];career.points+=Math.round(e.points*[.04,.12,.3][a.round]);resultRecord(e,round);career.active=null;message='Eliminated in the '+round+'. Your career continues — this event returns next year.';}save();setTimeout(()=>{screen.hidden=false;render();},1100);};
function render(){screen.hidden=false;$('tourStats').innerHTML=[['Season',career.year],['Week',career.week+'/52'],['World rank','#'+ranking()],['Points',career.points.toLocaleString()],['Record',career.wins+'–'+career.losses],['Titles',career.titles.length]].map(([k,v])=>'<div class="stat"><span class="muted">'+k+'</span><b>'+v+'</b></div>').join('');notice.innerHTML=message?'<div class="notice">'+esc(message)+'</div>':'';
if(tab==='calendar'){
let h='<div class="panel"><div class="bar"><div><strong>Season '+career.year+' · Week '+career.week+'</strong><div class="muted">Competing tournaments overlap. Enter one per week, or skip ahead.</div></div><button id="advance" '+(career.active?'disabled':'')+'>⏭ Next week</button></div></div>';
if(career.active){let a=career.active,e=events.find(ev=>ev.id===a.id);h+='<div class="panel"><h3>🏓 '+esc(e.name)+'</h3><p>Round: <b>'+['Quarterfinal','Semifinal','Final'][a.round]+'</b> · Opponent: '+esc(a.opponents[a.round])+'</p><button class="primary" id="playTourMatch">▶ PLAY MATCH</button></div>';}
else{let weekEvents=events.filter(e=>e.week===career.week&&available(e));h+='<h3>Available this week ('+weekEvents.length+')</h3><div class="events">'+(weekEvents.length?weekEvents.map(e=>'<div class="event"><h3>'+e.flag+' '+esc(e.name)+'</h3><div class="muted">'+(tiers[e.tier]||'Major Championship')+' · '+e.points+' points</div><div class="muted">'+(canEnter(e)?'Open for entry':'Requires world top '+(e.tier===5?16:24))+'</div><button class="primary" data-enter="'+e.id+'" '+(canEnter(e)?'':'disabled')+'>Enter tournament</button></div>').join(''):'<p>No tournament this week. Advance to the next week.</p>')+'</div>';}
h+='<div class="panel"><h3>📆 Season schedule</h3><p class="muted">80 regular events each year, plus the Tour Finals. World Championship every two years (even-numbered seasons).</p>'+events.filter(e=>e.week>=career.week&&available(e)).slice(0,20).map(e=>'<div class="row"><span>'+e.flag+' '+esc(e.name)+'</span><span>Week '+e.week+' · '+e.points+' pts</span></div>').join('')+'</div>';body.innerHTML=h;
$('advance')?.addEventListener('click',nextWeek);$('playTourMatch')?.addEventListener('click',play);body.querySelectorAll('[data-enter]').forEach(b=>b.addEventListener('click',()=>enter(+b.dataset.enter)));
}else if(tab==='rankings'){let all=[...career.rivals.map(r=>({...r,you:false})),{name:'YOU ('+(career.country||'Your country')+')',flag:flags[names.indexOf('London')]||'🏓',points:career.points,you:true}].sort((a,b)=>b.points-a.points);body.innerHTML='<div class="panel"><h3>World rankings</h3><p class="muted">Fictional professional players. Rankings evolve each week.</p>'+all.map((r,i)=>'<div class="row" style="'+(r.you?'background:#244d44;font-weight:700':'')+'"><span>#'+(i+1)+' '+(r.you?'🏓':r.flag)+' '+esc(r.name)+'</span><span>'+r.points.toLocaleString()+' pts</span></div>').join('')+'</div>';
}else if(tab==='history'){body.innerHTML='<div class="panel"><h3>Career results</h3>'+(career.history.length?career.history.map(h=>'<div class="row"><span>'+h.flag+' '+esc(h.event)+' · '+h.year+'</span><b>'+esc(h.round)+'</b></div>').join(''):'<p>No tournaments completed yet.</p>')+'</div>';}
else{body.innerHTML='<div class="panel"><h3>🏆 Trophy cabinet</h3>'+(career.titles.length?career.titles.map(t=>'<div class="row"><span>'+t.flag+' '+esc(t.event)+'</span><b>🥇 '+t.year+'</b></div>').join(''):'<p>Win a tournament to earn your first trophy.</p>')+'</div>';}}
$('tourOpen').addEventListener('click',()=>{let c=$('welcomeCountry').value;if(!c){$('welcomeStatus').textContent='Choose your country first.';return;}career.country=c;save();tab='calendar';render();});
$('tourClose').addEventListener('click',()=>{screen.hidden=true;message='';if(!document.body.classList.contains('playing'))$('welcome').hidden=false;});
screen.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();}));
})();
</script></body></html>
